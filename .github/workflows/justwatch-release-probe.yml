name: JustWatch release probe

on:
  workflow_dispatch:
  push:
    branches:
      - lab/justwatch-release-probe

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node lab/justwatch-release-probe.js
      - uses: actions/upload-artifact@v4
        with:
          name: justwatch-radar
          path: lab/justwatch-radar.json
          if-no-files-found: error
