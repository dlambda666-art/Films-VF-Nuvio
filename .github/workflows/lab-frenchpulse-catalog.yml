name: FrenchPulse catalog lab

on:
  push:
    branches:
      - lab/justwatch-release-probe

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check catalog.js
      - run: node lab/validate-catalog.mjs
      - run: node lab/justwatch-release-probe.js
