name: DoublageVF Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run DoublageVF diagnostic
        run: node scripts/sync-diagnostic.js

      - name: Upload diagnostic result
        uses: actions/upload-artifact@v4
        with:
          name: doublagevf-diagnostic
          path: doublagevf-diagnostic.json
