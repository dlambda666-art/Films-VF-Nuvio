name: FrenchPulse full radar lab

on:
  workflow_dispatch:
  push:
    branches:
      - lab/justwatch-release-probe

jobs:
  full-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RADAR_MODE: full
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check lab/justwatch-release-probe.js
      - run: node lab/justwatch-release-probe.js
      - name: Upload full radar snapshot
        uses: actions/upload-artifact@v4
        with:
          name: frenchpulse-full-radar
          path: lab/justwatch-radar.json
          retention-days: 7
