name: VF Index Sync

on:
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Scanner l'ensemble des pages DoublageVF"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync VF index
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          FULL_SYNC: ${{ github.event.inputs.full_sync == 'true' && '1' || '0' }}
        run: node scripts/sync-vf-index.js

      - name: Commit VF index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vf-index.json
          if git diff --cached --quiet; then
            echo "No VF index changes."
          else
            git commit -m "Update VF index"
            git push
          fi

      - name: Sync to Hugging Face
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: Lambda666/Films-VF-Nuvio
          hf_token: ${{ secrets.HF_TOKEN }}
          space_sdk: docker
